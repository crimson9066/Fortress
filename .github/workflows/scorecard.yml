name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "30 3 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        # v2.5.0
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true

      - name: Upload Scorecard results
        # v4.39.3
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          sarif_file: scorecard-results.sarif
