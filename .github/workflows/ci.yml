name: CI

on:
  pull_request:
  push:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        # v7.0.0
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Test
        working-directory: app
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        # v7.0.0
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Lint
        # v9.3.0
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          working-directory: app
          version: v2.15.0

  hadolint:
    name: hadolint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Lint Dockerfile
        # v3.5.0
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: app/Dockerfile

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        run: go run github.com/gitleaks/gitleaks/v8@v8.30.1 detect --source . --redact --log-opts="--all"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Go
        # v7.0.0
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Scan Go dependencies
        working-directory: app
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Initialize CodeQL
        # v4.39.3
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          languages: go
      - name: Autobuild
        # v4.39.3
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066
      - name: Analyze
        # v4.39.3
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066

  trivy-fs:
    name: trivy-fs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Trivy
        # v0.3.1
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      - name: Scan filesystem
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build image
        run: docker build --file app/Dockerfile --tag fortress:ci app
      - name: Set up Trivy
        # v0.3.1
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
      - name: Scan image
        run: trivy image --severity HIGH,CRITICAL --exit-code 1 fortress:ci

  sbom:
    name: sbom
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build image
        run: docker build --file app/Dockerfile --tag fortress:ci app
      - name: Generate CycloneDX SBOM
        # v0.24.3
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: fortress:ci
          format: cyclonedx-json
          output-file: fortress-sbom.cdx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fortress-sbom-cyclonedx
          path: fortress-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  kyverno:
    name: kyverno-policy-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Kyverno CLI
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kyverno.tar.gz \
            https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  /tmp/kyverno.tar.gz" | sha256sum --check
          tar -xzf /tmp/kyverno.tar.gz -C /tmp
          install /tmp/kyverno /usr/local/bin/kyverno
      - name: Run Kyverno pass and fail fixtures
        run: kyverno test policies/tests
