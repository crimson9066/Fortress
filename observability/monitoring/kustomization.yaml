apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - servicemonitor-items.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: fortress-grafana-dashboards
    files:
      - dashboards/fortress-red.json
      - dashboards/cluster-health.json
      - dashboards/kyverno-violations.json
      - dashboards/falco-events.json
    options:
      labels:
        grafana_dashboard: "1"
