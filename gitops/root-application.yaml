apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fortress-apps
  namespace: argocd
spec:
  project: fortress
  source:
    repoURL: https://github.com/crimson9066/Fortress.git
    targetRevision: main
    path: gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
