apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: fortress
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.0
      helm:
        releaseName: kube-prometheus-stack
        valuesObject:
          defaultRules:
            create: false
          nodeExporter:
            enabled: false
          grafana:
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              passwordKey: admin-password
            securityContext:
              runAsNonRoot: true
              runAsUser: 472
              runAsGroup: 472
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 250m
                memory: 256Mi
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
                labelValue: "1"
            service:
              type: ClusterIP
          prometheus:
            prometheusSpec:
              retention: 28d
              serviceMonitorSelector: {}
              serviceMonitorNamespaceSelector: {}
              ruleSelector: {}
              ruleNamespaceSelector: {}
              arbitraryFSAccessThroughSMs:
                deny: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          alertmanager:
            alertmanagerSpec:
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          prometheusOperator:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
    - repoURL: https://github.com/crimson9066/Fortress.git
      targetRevision: main
      path: observability/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
