apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
spec:
  project: fortress
  sources:
    - repoURL: https://falcosecurity.github.io/charts
      chart: falco
      targetRevision: 7.1.0
      helm:
        releaseName: falco
        valuesObject:
          driver:
            kind: modern_ebpf
          falco:
            json_output: true
            json_include_output_property: true
            http_output:
              enabled: true
              url: http://falcosidekick.falco.svc.cluster.local:2801
          customRules:
            fortress-rules.yaml: |
              - rule: Fortress shell spawned in container
                desc: A shell was started inside a Fortress application container.
                condition: spawned_process and container and proc.name in (bash, sh, ash, dash, zsh)
                output: "Shell spawned in container (user=%user.name shell=%proc.name pod=%k8s.pod.name ns=%k8s.ns.name)"
                priority: WARNING
                tags: [container, process, fortress]
              - rule: Fortress write below etc
                desc: A container wrote below /etc.
                condition: open_write and container and fd.name startswith /etc/
                output: "Write below /etc (file=%fd.name pod=%k8s.pod.name ns=%k8s.ns.name)"
                priority: WARNING
                tags: [container, filesystem, fortress]
              - rule: Fortress service account token read
                desc: A container read its Kubernetes service account token.
                condition: open_read and container and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/token
                output: "Service account token read (file=%fd.name pod=%k8s.pod.name ns=%k8s.ns.name)"
                priority: WARNING
                tags: [container, credential, fortress]
              - rule: Fortress unexpected outbound connection
                desc: The items workload opened an outbound connection.
                condition: evt.type=connect and container and k8s.ns.name in (items-dev, items-prod) and fd.sip != 127.0.0.1
                output: "Unexpected outbound connection from items pod (remote=%fd.sip:%fd.sport pod=%k8s.pod.name ns=%k8s.ns.name)"
                priority: NOTICE
                tags: [container, network, fortress]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
    - repoURL: https://falcosecurity.github.io/charts
      chart: falcosidekick
      targetRevision: 0.3.5
      helm:
        releaseName: falcosidekick
        valuesObject:
          config:
            alertmanager:
              hostport: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
              minimumpriority: warning
              extraannotations:
                runbook_url: https://github.com/crimson9066/Fortress/blob/main/docs/runbooks/falco-events.md
          serviceMonitor:
            enabled: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
    - repoURL: https://github.com/crimson9066/Fortress.git
      targetRevision: main
      path: observability/falco
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
