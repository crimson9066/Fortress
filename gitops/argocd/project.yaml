apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fortress
  namespace: argocd
spec:
  description: Fortress workloads with explicitly restricted GitOps boundaries.
  sourceRepos:
    - https://github.com/crimson9066/Fortress.git
  destinations:
    - namespace: items-dev
      server: https://kubernetes.default.svc
    - namespace: items-prod
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
