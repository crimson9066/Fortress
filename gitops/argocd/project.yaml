apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fortress
  namespace: argocd
spec:
  description: Fortress workloads with explicitly restricted GitOps boundaries.
  sourceRepos:
    - https://github.com/crimson9066/Fortress.git
    - https://kyverno.github.io/kyverno
    - https://charts.external-secrets.io
  destinations:
    - namespace: items-dev
      server: https://kubernetes.default.svc
    - namespace: items-prod
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: kyverno.io
      kind: ClusterPolicy
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: ExternalSecret
