apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-admin-fake
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: /fortress/monitoring/grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: /fortress/monitoring/grafana-admin-password
