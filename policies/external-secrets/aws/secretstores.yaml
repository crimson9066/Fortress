apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: items-aws
  namespace: items-dev
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fortress-external-secrets-dev
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: items-aws
  namespace: items-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fortress-external-secrets-prod
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
