apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: items-config
  namespace: items-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: items-aws
    kind: SecretStore
  target:
    name: items-config
    creationPolicy: Owner
  data:
    - secretKey: ITEMS_CONFIG
      remoteRef:
        key: fortress/dev/items
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: items-config
  namespace: items-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: items-aws
    kind: SecretStore
  target:
    name: items-config
    creationPolicy: Owner
  data:
    - secretKey: ITEMS_CONFIG
      remoteRef:
        key: fortress/prod/items
