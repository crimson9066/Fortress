apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grafana-admin-aws
  namespace: monitoring
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      role: arn:aws:iam::REPLACE_ACCOUNT_ID:role/fortress-external-secrets-monitoring
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: grafana-admin-aws
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: fortress/monitoring/grafana-admin-user
    - secretKey: admin-password
      remoteRef:
        key: fortress/monitoring/grafana-admin-password
