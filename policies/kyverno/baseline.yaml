apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: fortress-baseline-pod-security
  annotations:
    policies.kyverno.io/title: Fortress baseline pod security
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/description: Require the workload security properties documented by Fortress.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Privileged containers are not allowed.
        pattern:
          spec:
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            containers:
              - =(securityContext):
                  =(privileged): "false"
    - name: disallow-host-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Host namespaces are not allowed.
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
    - name: disallow-hostpath
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: hostPath volumes are not allowed.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.volumes[?hostPath] | length(@) }}"
                operator: GreaterThan
                value: 0
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Pods must run as non-root.
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
    - name: require-read-only-root-filesystem
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Every container must use a read-only root filesystem.
        foreach:
          - list: request.object.spec.containers[]
            pattern:
              securityContext:
                readOnlyRootFilesystem: true
          - list: request.object.spec.initContainers[]
            pattern:
              securityContext:
                readOnlyRootFilesystem: true
    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Every container must drop all Linux capabilities.
        foreach:
          - list: request.object.spec.containers[]
            pattern:
              securityContext:
                capabilities:
                  drop:
                    - ALL
          - list: request.object.spec.initContainers[]
            pattern:
              securityContext:
                capabilities:
                  drop:
                    - ALL
    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: Every container must define CPU and memory limits.
        foreach:
          - list: request.object.spec.containers[]
            pattern:
              resources:
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: request.object.spec.initContainers[]
            pattern:
              resources:
                limits:
                  cpu: "?*"
                  memory: "?*"
