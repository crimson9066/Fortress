apiVersion: v1
kind: Pod
metadata:
  name: insecure-items
  labels:
    owner: crimson9066
    app.kubernetes.io/name: items
spec:
  containers:
    - name: items
      image: ghcr.io/crimson9066/fortress:latest
      securityContext:
        privileged: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
  volumes:
    - name: host
      hostPath:
        path: /etc
