apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fortress-baseline
policies:
  - ../kyverno/baseline.yaml
resources:
  - pass-pod.yaml
  - fail-pod.yaml
results:
  - policy: fortress-baseline-pod-security
    rule: require-run-as-non-root
    resources:
      - secure-items
    kind: Pod
    result: pass
  - policy: fortress-baseline-pod-security
    rule: require-run-as-non-root
    resources:
      - insecure-items
    kind: Pod
    result: fail
  - policy: fortress-baseline-pod-security
    rule: require-read-only-root-filesystem
    resources:
      - secure-items
    kind: Pod
    result: pass
  - policy: fortress-baseline-pod-security
    rule: require-read-only-root-filesystem
    resources:
      - insecure-items
    kind: Pod
    result: fail
