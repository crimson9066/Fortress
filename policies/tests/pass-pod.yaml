apiVersion: v1
kind: Pod
metadata:
  name: secure-items
  labels:
    owner: crimson9066
    app.kubernetes.io/name: items
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: items
      image: ghcr.io/crimson9066/fortress@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      securityContext:
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
